name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build web app
        run: pnpm build

  database:
    name: Database policies and Supabase transport
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      POSTGREST_VERSION: v12.2.3
      POSTGREST_SHA256: 9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Migrations and RLS policy tests
        run: supabase/tests/run-db-tests.sh
      - name: Install PostgREST
        run: |
          curl -fsSL -o "$RUNNER_TEMP/postgrest.tar.xz" \
            "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          echo "${POSTGREST_SHA256}  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP"
      - name: Supabase transport against PostgREST + RLS
        run: POSTGREST_BIN="$RUNNER_TEMP/postgrest" supabase/tests/run-integration.sh

  webkit:
    name: Release gate · WebKit mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install isolated Playwright WebKit
        run: |
          npm install --prefix .ci-playwright --no-save playwright@1.55.0
          .ci-playwright/node_modules/.bin/playwright install --with-deps webkit
      - name: Build production web app
        run: pnpm build
      - name: Start production web app
        run: |
          pnpm --filter @super-gongik/web start > "$RUNNER_TEMP/super-gongik-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/super-gongik-web.pid"
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3000/ >/dev/null; do sleep 1; done'
      - name: Run mobile WebKit release gate
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-playwright/node_modules
          RELEASE_GATE_BASE_URL: http://127.0.0.1:3000
          RELEASE_GATE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/webkit-mobile
        run: node scripts/release-gate-webkit.cjs
      - name: Upload WebKit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-mobile-${{ github.sha }}
          path: artifacts/webkit-mobile
          if-no-files-found: warn
          retention-days: 14
      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/super-gongik-web.log" || true

