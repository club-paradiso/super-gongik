name: Prettier probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --write             docs/COMPENSATION_POLICY_2026.md             packages/rules/compensation/2026.json             packages/rules/src/bundles.ts             packages/rules/src/compensation.ts             packages/rules/src/monthly-compensation.ts             packages/rules/tests/compensation-closure.test.ts
          git diff --no-ext-diff --             docs/COMPENSATION_POLICY_2026.md             packages/rules/compensation/2026.json             packages/rules/src/bundles.ts             packages/rules/src/compensation.ts             packages/rules/src/monthly-compensation.ts             packages/rules/tests/compensation-closure.test.ts