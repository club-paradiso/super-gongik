name: Apply Prettier once
permissions:
  contents: write
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/payer-rounding-nonpayable-days
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/COMPENSATION_POLICY_2026.md
      - name: Commit formatting if needed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COMPENSATION_POLICY_2026.md
          git commit -m "style: format compensation policy docs"
          git push origin HEAD:feat/payer-rounding-nonpayable-days
