name: Apply import hardening Prettier
permissions:
  contents: write
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/import-hardening-real-world
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/record-import-panel.tsx apps/web/src/lib/file-import-adapters.ts apps/web/tests/import-adapters.test.ts docs/IMPORT_ENGINE.md packages/importer/src/csv.ts packages/importer/src/preview.ts packages/importer/tests/importer.test.ts
      - name: Commit formatting if needed
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/record-import-panel.tsx apps/web/src/lib/file-import-adapters.ts apps/web/tests/import-adapters.test.ts docs/IMPORT_ENGINE.md packages/importer/src/csv.ts packages/importer/src/preview.ts packages/importer/tests/importer.test.ts
          git commit -m "style: format import hardening"
          git push origin HEAD:feat/import-hardening-real-world
